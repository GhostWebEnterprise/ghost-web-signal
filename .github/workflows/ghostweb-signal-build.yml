name: GhostWeb Signal Android Build

on:
  push:
    branches:
      - GWSignal.main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified signed APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghostweb-signal-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/GWSignal.main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
    env:
      CI_KEYSTORE_PATH: ${{ github.workspace }}/ghostweb-release.jks
      CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CI_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CI_APP_TITLE: GhostWeb Signal
      CI_PACKAGE_ID: org.ghostweb.signal
      CI_BUILD_VARIANTS: prodWebsite(Release|Debug)
      CI_FORCE_INTERNAL_USER_FLAG: "false"
      # Must match docs/ui-gate.md and the resValue in app/build.gradle.kts.
      CI_UI_GATE_VERSION: photon-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Free disk space
        uses: ./.github/actions/disk-cleanup

      - name: Configure CI memory
        run: |
          if ! sudo swapon --show --noheadings | grep -q .; then
            sudo fallocate -l 4G /mnt/ghostweb-swapfile
            sudo chmod 600 /mnt/ghostweb-swapfile
            sudo mkswap /mnt/ghostweb-swapfile
            sudo swapon /mnt/ghostweb-swapfile
          fi
          sudo swapon --show
          free -h

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$CI_KEYSTORE_PASSWORD"
          test -n "$CI_KEYSTORE_ALIAS"
          test -n "$CI_KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$CI_KEYSTORE_PATH"
          test -s "$CI_KEYSTORE_PATH"
          keytool -list -keystore "$CI_KEYSTORE_PATH" \
            -storepass:env CI_KEYSTORE_PASSWORD -alias "$CI_KEYSTORE_ALIAS" > /dev/null

      - name: Build and test GhostWeb Signal release
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx7g -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions -XX:hashCode=3" \
            -Dorg.gradle.parallel=false \
            :app:assembleProdWebsiteRelease \
            :app:testProdWebsiteDebugUnitTest \
            --tests 'org.thoughtcrime.securesms.main.GhostWebStartupAnimationTest' \
            --tests 'org.thoughtcrime.securesms.ui.GhostWebPhotonUiRegressionTest' \
            --stacktrace \
            -PbaseAppTitle="$CI_APP_TITLE" \
            -PbaseAppFileName="GhostWeb-Signal" \
            -PbasePackageId="$CI_PACKAGE_ID" \
            -PbuildVariants="$CI_BUILD_VARIANTS" \
            -PforceInternalUserFlag="$CI_FORCE_INTERNAL_USER_FLAG"

      - name: Verify Photon UI regression test results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET
          reports = glob.glob('app/build/test-results/testProdWebsiteDebugUnitTest/**/*.xml', recursive=True)
          found = False
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  if 'GhostWebPhotonUiRegressionTest' in case.attrib.get('classname', ''):
                      found = True
                      if any(child.tag in ('failure', 'error', 'skipped') for child in case):
                          sys.exit('Photon UI regression test failed or skipped: ' + report)
          if not found:
              sys.exit('Photon UI regression tests were not executed; blocking release')
          print('Photon UI regression tests executed successfully')
          PY

      - name: Verify release APK and signature
        id: verify
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          if [[ "$(basename "$apk")" == *-unsigned-* ]]; then
            echo "::error::Refusing unsigned APK filename: $(basename "$apk")" >&2
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee dist/apksigner.txt
          grep -Fq "Verifies" dist/apksigner.txt || {
            echo "::error::apksigner did not report a verified signature" >&2
            exit 1
          }
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" dist/apksigner.txt || {
            echo "::error::APK Signature Scheme v2 is required" >&2
            exit 1
          }
          grep -Fq "Number of signers: 1" dist/apksigner.txt || {
            echo "::error::Expected exactly one APK signer" >&2
            exit 1
          }
          EXPECTED_SIGNER_SHA256="64bb12f28a7d39d2cf921024c6d36019ea3808481bd4471511bd83ca64f20435"
          grep -Fq "Signer #1 certificate SHA-256 digest: ${EXPECTED_SIGNER_SHA256}" dist/apksigner.txt || {
            echo "::error::APK signer differs from the published GhostWeb Signal update identity" >&2
            exit 1
          }
          badging=$("$tools/aapt" dump badging "$apk")
          package=$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<< "$badging")
          version=$(sed -n "s/^package: .*versionName='\\([^']*\\)'.*/\\1/p" <<< "$badging")
          test "$package" = "$CI_PACKAGE_ID"
          [[ "$version" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+$ ]]
          cp "$apk" "dist/GhostWeb-Signal-v${version}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          printf 'Commit: %s\nVersion: %s\nPackage: %s\n' \
            "$GITHUB_SHA" "$version" "$package" > dist/BUILD.txt
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Enforce UI gate before publishing
        env:
          UI_GATE_EXPECTED_VERSION: ${{ env.CI_UI_GATE_VERSION }}
        run: |
          # The Photon UI migration gate: a green build alone never releases a
          # new APK. See docs/ui-gate.md for the full gate criteria.
          apk="$(find dist -name '*.apk' | head -1)"
          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          cat > dist/UI_GATE.md <<EOF_GATE
          # GhostWeb Signal UI Gate

          Gate version: ${UI_GATE_EXPECTED_VERSION}
          UI_GATE_STATUS: PASS

          Covered by GhostWebPhotonUiRegressionTest (palette and surface tokens,
          resolved theme/button roles, unread badge, startup overlay lifecycle and
          drawables/layout, conversation-list menu items, and core layout resource
          presence) executed in :app:testProdWebsiteDebugUnitTest on this exact build.
          This automated gate does not replace physical-device or visual-flow testing.

          APK: $(basename "$apk")
          APK SHA-256: ${apk_sha256}
          Source commit: ${GITHUB_SHA}
          EOF_GATE
          test -f dist/UI_GATE.md
          grep -q "Gate version: ${UI_GATE_EXPECTED_VERSION}" dist/UI_GATE.md || {
            echo "::error::UI gate version mismatch; expected ${UI_GATE_EXPECTED_VERSION}" >&2; exit 1;
          }
          grep -q "UI_GATE_STATUS: PASS" dist/UI_GATE.md || {
            echo "::error::UI gate not passed (UI_GATE_STATUS: PASS missing)" >&2; exit 1;
          }
          echo "UI gate ${UI_GATE_EXPECTED_VERSION} verified for $(basename "$apk")"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostweb-signal-release-apk
          path: dist/
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostweb-startup-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: rm -f "$CI_KEYSTORE_PATH"

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/GWSignal.main' &&
      (inputs.publish_release == true ||
       contains(github.event.head_commit.message, '[publish-apk]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: ghostweb-signal-release-apk
          path: dist

      - name: Publish verified release
        run: |
          set -euo pipefail
          # Refuse to publish a lower version tag than any already-published
          # GhostWeb Signal release. Version selection remains an explicit
          # release decision; this guard only prevents accidental regression.
          all_published_tags="$(gh release list --repo "$GH_REPO" --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName')"
          published_tags="$(printf '%s\n' "$all_published_tags" | grep -E '^v[0-9]+(\.[0-9]+)*(-[0-9]+)?$' || true)"
          latest_tag="$(printf '%s\n' "$published_tags" | sort -V | tail -n 1)"
          if [ -n "$latest_tag" ]; then
            highest_tag="$(printf '%s\n%s\n' "$latest_tag" "$RELEASE_TAG" | sort -V | tail -n 1)"
            if [ "$highest_tag" != "$RELEASE_TAG" ]; then
              echo "::error::Refusing non-monotonic release $RELEASE_TAG; latest published release is $latest_tag" >&2
              exit 1
            fi
          fi
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; verifying existing release instead of overwriting it."
            mkdir downloaded
            gh release download "$RELEASE_TAG" --pattern '*.apk' --dir downloaded
            if (cd downloaded && sha256sum --check ../SHA256SUMS); then
              echo "Existing release already contains the verified APK bytes."
              exit 0
            fi
            echo "Existing release tag points to different APK bytes; refusing to overwrite an immutable published release." >&2
            exit 1
          fi
          cat > release-notes.md <<EOF_NOTES
          GhostWeb Signal startup animation with the original icon and violet Photon-inspired glow.

          Plays after completed registration and app unlock. Respects disabled animations.
          Android 12+ uses blur-to-focus; older devices use a scale/fade transition.

          Photon UI migration gate verified before publishing (see UI_GATE.md and docs/ui-gate.md).

          Source commit: $GITHUB_SHA
          Signed APK and startup lifecycle tests verified by GitHub Actions.
          Physical-device registration and biometric testing is still required.
          EOF_NOTES
          gh release create "$RELEASE_TAG" ./*.apk SHA256SUMS BUILD.txt UI_GATE.md apksigner.txt \
            --target "$GITHUB_SHA" --draft \
            --title "GhostWeb Signal $RELEASE_TAG" --notes-file release-notes.md
          mkdir downloaded
          gh release download "$RELEASE_TAG" --pattern '*.apk' --dir downloaded
          (cd downloaded && sha256sum --check ../SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false
