name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

env:
  TAG_REF: "${{ inputs.version || github.ref_name }}"
  BUILD_ENV_FILE: ${{ vars.BUILD_ENV_FILE || 'beta-stable.env' }}

jobs:
  build:
    name: Build signed release
    if: "github.event.base_ref != 'refs/heads/upstream-main'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ env.TAG_REF }}"
      - name: Free up disk space in runner
        uses: ./.github/actions/disk-cleanup
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Require release signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.SECRET_KEYSTORE }}
          KEYSTORE_ALIAS: ${{ secrets.SECRET_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.SECRET_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" || { echo "::error::SECRET_KEYSTORE is missing"; exit 1; }
          test -n "$KEYSTORE_ALIAS" || { echo "::error::SECRET_KEYSTORE_ALIAS is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::SECRET_KEYSTORE_PASSWORD is missing"; exit 1; }
      - name: Build Docker image
        run: docker compose build
        working-directory: reproducible-builds
      - name: Export CI environment variables
        run: |
          cp -v "ci/$BUILD_ENV_FILE" .env
          for var in APP_TITLE APP_FILENAME PACKAGE_ID BUILD_VARIANTS FORCE_INTERNAL_USER_FLAG MAPS_API_KEY; do
            if [ -n "${!var}" ]; then
              echo "Setting CI_$var=${!var}"
              echo "CI_$var=${!var}" >> $GITHUB_ENV
            fi
          done
        working-directory: reproducible-builds
        env:
          APP_TITLE: ${{ vars.CI_APP_TITLE }}
          APP_FILENAME: ${{ vars.CI_APP_FILENAME }}
          PACKAGE_ID: ${{ vars.CI_PACKAGE_ID }}
          BUILD_VARIANTS: ${{ vars.CI_BUILD_VARIANTS }}
          FORCE_INTERNAL_USER_FLAG: ${{ vars.CI_FORCE_INTERNAL_USER_FLAG }}
      - name: Extract signing keys
        run: printenv KEYSTORE | base64 -d > certs/keystore.jks
        working-directory: reproducible-builds
        env:
          KEYSTORE: ${{ secrets.SECRET_KEYSTORE }}
      - name: Build and sign
        run: docker compose run -v "$GRADLE_USER_HOME/caches:/.gradle-ro-cache:ro" assemble
        working-directory: reproducible-builds
        env:
          CI_KEYSTORE_PATH: certs/keystore.jks
          CI_KEYSTORE_ALIAS: ${{ secrets.SECRET_KEYSTORE_ALIAS }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.SECRET_KEYSTORE_PASSWORD }}
      - name: Clean up keystore
        if: always()
        run: rm -f certs/keystore.jks
        working-directory: reproducible-builds
      - name: Reject unsigned release APKs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(outputs/apk/*/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::No release APKs produced"; exit 1; }
          for apk in "${apks[@]}"; do
            if [[ "$(basename "$apk")" == *-unsigned-* ]]; then
              echo "::error::Unsigned APK produced: $apk"
              exit 1
            fi
          done
        working-directory: reproducible-builds
      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          find outputs/apk -path '*/release/*.apk' -print0 | while IFS= read -r -d '' apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
        working-directory: reproducible-builds
      - name: Log APK and AAB checksums
        run: find outputs \( -name "*.aab" -o -name "*.apk" \) -exec sha256sum '{}' +
        working-directory: reproducible-builds
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: reproducible-builds/outputs/apk/*/release/*.apk
          if-no-files-found: error
      - name: Upload Bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: reproducible-builds/outputs/bundle/*Release/*.aab
          if-no-files-found: error

  prepare_release:
    name: Prepare release
    if: "github.event.base_ref != 'refs/heads/upstream-main'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ env.TAG_REF }}"
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "$TAG_REF"; then echo "release_exists=true" >> $GITHUB_OUTPUT; else echo "release_exists=false" >> $GITHUB_OUTPUT; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release draft
        if: "steps.check_release.outputs.release_exists == 'false'"
        run: gh release create -d --verify-tag -t "$TAG_REF" "$TAG_REF"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_PAT || secrets.GITHUB_TOKEN }}

  upload:
    name: Upload verified signed APKs
    runs-on: ubuntu-24.04
    needs: [build, prepare_release]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ env.TAG_REF }}"
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Reject unsigned artifacts before publishing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(apk/*/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::No APK artifacts downloaded"; exit 1; }
          for apk in "${apks[@]}"; do
            [[ "$(basename "$apk")" != *-unsigned-* ]] || { echo "::error::Refusing to publish unsigned APK: $apk"; exit 1; }
          done
      - name: Upload APKs to GitHub release
        run: gh release upload "$TAG_REF" ./apk/*/release/*.apk --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_PAT || secrets.GITHUB_TOKEN }}
