name: GhostWeb privacy and design debug build

on:
  push:
    branches:
      - codex/graphene-privacy-design
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphene-privacy-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI_BUILD_VARIANTS: prod(Website|Store)Debug|stagingWebsiteDebug
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/disk-cleanup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Configure memory for the Kotlin compiler
        run: |
          if ! sudo swapon --show --noheadings | grep -q .; then
            sudo fallocate -l 4G /mnt/ghostweb-debug-swap
            sudo chmod 600 /mnt/ghostweb-debug-swap
            sudo mkswap /mnt/ghostweb-debug-swap
            sudo swapon /mnt/ghostweb-debug-swap
          fi
          free -h
      - name: Install the pinned Android SDK packages
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;28.0.13004108'
      - name: Check privacy source contracts
        run: python3 tools/check_graphene_privacy.py
      - name: Build production website debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-parallel --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx10g -XX:+UseG1GC' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PbuildVariants="$CI_BUILD_VARIANTS" \
            :app:assembleProdWebsiteDebug --stacktrace
      - name: Run production website unit tests
        run: |
          ./gradlew --no-daemon --no-configuration-cache --no-parallel --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx10g -XX:+UseG1GC' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PbuildVariants="$CI_BUILD_VARIANTS" \
            :app:testProdWebsiteDebugUnitTest --stacktrace
      - name: Build store and staging debug variants
        run: |
          ./gradlew --no-daemon --no-configuration-cache --no-parallel --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx10g -XX:+UseG1GC' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PbuildVariants="$CI_BUILD_VARIANTS" \
            :app:assembleProdStoreDebug \
            :app:assembleStagingWebsiteDebug --stacktrace
      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ghostweb-privacy-design-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghostweb-privacy-design-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
