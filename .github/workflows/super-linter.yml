name: Super-Linter

on:
  push:
    branches:
      - Ghostly.main
      - main
  pull_request:
    branches:
      - Ghostly.main
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: super-linter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    # The full Signal/Molly codebase needs more than 45 minutes to lint all
    # enabled languages; previous runs were killed right at the old limit.
    timeout-minutes: 60
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: Ghostly.main
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_KOTLIN: true
          VALIDATE_JAVA: true
          VALIDATE_GROOVY: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          IGNORE_GITIGNORED_FILES: true
          FILTER_REGEX_EXCLUDE: '(^|/)(build|\.gradle|\.idea|generated|node_modules|reproducible-builds)(/|$)|(^|/)(local\.properties)$'
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          SAVE_SUPER_LINTER_SUMMARY: true
