name: Test

on:
  pull_request:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/README*.md'
      - '**/BUILDING.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Free up disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Copy Docker gradle.properties
        run: cp gradle.properties.docker "$GRADLE_USER_HOME/gradle.properties"

      - name: Build and run tests
        run: ./gradlew --write-verification-metadata sha256 build

      - name: Archive reports for failed build
        if: "failure()"
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_id }}
          path: |
            **/build/reports
            **/build/test-results
          if-no-files-found: ignore

  prepare_release_tag:
    name: Tag release
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Extract version
        id: extract_version
        run: |
          ver=$(./gradlew -q --no-configuration-cache :app:printVersion | jq -r .android.versionName)
          echo "version=v$ver" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        run: |
          tag="${{ steps.extract_version.outputs.version }}"
          git tag -f "$tag"
          if [ -n "${{ secrets.PUBLISH_PAT }}" ]; then
            git remote set-url origin "https://x-access-token:${{ secrets.PUBLISH_PAT }}@github.com/${{ github.repository }}.git"
          fi
          git push -f origin "$tag"

  release:
    name: Build and publish APK
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    needs:
      - test
      - prepare_release_tag
    permissions:
      contents: write
      # The called release workflow reads Actions run history for the UI gate.
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare_release_tag.outputs.version }}
    secrets: inherit
