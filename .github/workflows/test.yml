name: Test

on:
  pull_request:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/README*.md'
      - '**/BUILDING.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: ghostweb-signal-tests-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - name: Test accepted apksigner fingerprint formats
        run: bash tests/test_apksigner_fingerprint.sh

      - name: Free up disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Copy Docker gradle.properties
        run: cp gradle.properties.docker "$GRADLE_USER_HOME/gradle.properties"

      - name: Build and run tests
        run: ./gradlew --write-verification-metadata sha256 build

      - name: Verify Photon UI and startup regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "org.thoughtcrime.securesms.ui.GhostWebPhotonUiRegressionTest",
              "org.thoughtcrime.securesms.main.GhostWebStartupAnimationTest",
          }
          found = set()
          reports = glob.glob(
              "app/build/test-results/testProdWebsiteDebugUnitTest/**/*.xml",
              recursive=True,
          )
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  classname = case.attrib.get("classname", "")
                  if classname in expected:
                      found.add(classname)
                      if any(child.tag in ("failure", "error", "skipped") for child in case):
                          sys.exit("Required GhostWeb regression test failed or skipped: " + classname)

          missing = expected - found
          if missing:
              sys.exit("Required GhostWeb regression tests were not executed: " + ", ".join(sorted(missing)))
          print("Photon UI and startup regression tests executed successfully")
          PY

      - name: Archive reports for failed build
        if: "failure()"
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_id }}
          path: |
            **/build/reports
            **/build/test-results
          if-no-files-found: ignore

  prepare_release_tag:
    name: Tag release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/GWSignal.main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Extract version
        id: extract_version
        run: |
          set -euo pipefail
          ver=$(./gradlew -q --no-configuration-cache :app:printVersion | jq -r .android.versionName)
          test -n "$ver" || { echo "::error::Could not extract Android version"; exit 1; }
          echo "version=v$ver" >> "$GITHUB_OUTPUT"

      - name: Create and push immutable release tag
        env:
          TAG: ${{ steps.extract_version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          # Use GITHUB_TOKEN so the tag push cannot launch a second, un-gated tag workflow.
          # The reusable release workflow below runs only after the test job succeeds.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9]+)?$ ]]; then
            echo "::error::Invalid release version tag: $TAG" >&2
            exit 1
          fi
          all_published_tags="$(gh release list --repo "$REPOSITORY" --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName')"
          published_tags="$(printf '%s\n' "$all_published_tags" | grep -E '^v[0-9]+(\.[0-9]+)*(-[0-9]+)?$' || true)"
          latest_tag="$(printf '%s\n' "$published_tags" | sort -V | tail -n 1)"
          if [ -n "$latest_tag" ]; then
            highest_tag="$(printf '%s\n%s\n' "$latest_tag" "$TAG" | sort -V | tail -n 1)"
            if [ "$highest_tag" != "$TAG" ]; then
              echo "::error::Refusing non-monotonic release $TAG; latest published release is $latest_tag" >&2
              exit 1
            fi
          fi
          git check-ref-format "refs/tags/$TAG"
          # Fail closed if the remote cannot be queried or the tag already exists.
          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$remote_tag" ]; then
            echo "::error::Refusing to move existing release tag $TAG"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Local tag $TAG already exists; refusing to overwrite it"
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

  release:
    name: Build and publish APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/GWSignal.main' && contains(github.event.head_commit.message, '[release]')
    needs:
      - test
      - prepare_release_tag
    permissions:
      contents: write
      # The called release workflow reads Actions run history for the UI gate.
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare_release_tag.outputs.version }}
    secrets: inherit
