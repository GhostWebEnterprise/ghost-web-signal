name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2,18,22 * * *'

permissions:
  contents: write

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout GhostWeb base
        uses: actions/checkout@v6
        with:
          ref: GWSignal.main
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Fetch Signal upstream
        run: |
          git remote add upstream https://github.com/signalapp/Signal-Android.git
          git fetch --prune upstream main
          git fetch --tags upstream
        env:
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Recreate upstream-main from upstream/main
        run: git checkout -B upstream-main upstream/main

      - run: git lfs fetch --all upstream

      - name: Publish upstream-main
        run: git push --force-with-lease origin upstream-main

      - name: Track upstream stable release
        run: |
          curl -fsSL -o latest.json https://updates.signal.org/android/latest.json
          tag="v$(jq -r .versionName latest.json)"
          if ! git rev-parse -q --verify "refs/tags/${tag}"; then
            echo "::notice::tag ${tag} not pushed to upstream yet, skipping"
            exit 0
          fi
          git push -f origin "${tag}^{commit}:refs/heads/upstream-stable"
