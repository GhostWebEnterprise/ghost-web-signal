name: Tag Commit for Release

on:
  workflow_dispatch:

# Release automation is owned by test.yml for [release] commits.
# Keeping this workflow manual avoids duplicate tag/release races.
jobs:
  push_tag:
    name: Push version tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Extract version
        id: extract_version
        run: |
          ver=$(./gradlew -q :app:printVersion | jq -r .android.versionName)
          echo "version=v$ver" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        run: |
          git tag -f "${{ steps.extract_version.outputs.version }}"
          git push -f origin "${{ steps.extract_version.outputs.version }}"
