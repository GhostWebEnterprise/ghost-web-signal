name: Tag Commit for Release

on:
  workflow_dispatch:

# Release automation is owned by test.yml for [release] commits.
# Keeping this workflow manual avoids duplicate tag/release races.
jobs:
  push_tag:
    name: Push version tag
    if: github.ref == 'refs/heads/GWSignal.main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Extract version
        id: extract_version
        run: |
          ver=$(./gradlew -q :app:printVersion | jq -r .android.versionName)
          test -n "$ver" || { echo "::error::Could not extract Android version"; exit 1; }
          echo "version=v$ver" >> "$GITHUB_OUTPUT"

      - name: Refuse non-monotonic release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.extract_version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9]+)?$ ]]; then
            echo "::error::Invalid release version tag: $TAG" >&2
            exit 1
          fi
          all_published_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName')"
          published_tags="$(printf '%s\n' "$all_published_tags" | grep -E '^v[0-9]+(\.[0-9]+)*(-[0-9]+)?$' || true)"
          latest_tag="$(printf '%s\n' "$published_tags" | sort -V | tail -n 1)"
          if [ -n "$latest_tag" ]; then
            highest_tag="$(printf '%s\n%s\n' "$latest_tag" "$TAG" | sort -V | tail -n 1)"
            if [ "$highest_tag" != "$TAG" ]; then
              echo "::error::Refusing non-monotonic release $TAG; latest published release is $latest_tag" >&2
              exit 1
            fi
          fi
      - name: Create and push immutable release tag
        env:
          TAG: ${{ steps.extract_version.outputs.version }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          # Fail closed if the remote cannot be queried or if the tag already exists.
          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$remote_tag" ]; then
            echo "::error::Refusing to move existing release tag $TAG"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Local tag $TAG already exists; refusing to overwrite it"
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
